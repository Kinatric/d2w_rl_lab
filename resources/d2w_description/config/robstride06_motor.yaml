# Canonical RobStride 06 actuator model used by both Isaac Lab and MuJoCo.
# RS06 specifications verified against official Chinese manual 260428.
# Output-side specifications and explicitly unverified simulation assumptions
# are distinguished below. The overload budget is not a winding-temperature model.
# The URDF effort/velocity fields contain output-side physical maxima only. A
# simulator enforces the instantaneous peak envelope, matching project Go2.
# Continuous/time-limited data remains reference metadata for this mode; it is
# not a simulation temperature model or a hardware continuous-duty guarantee.

schema_version: 1
data_revision: official_manual_260428_v2
protection_mode: instantaneous_envelope
model: RobStride_06
quantity: 12
assignment: all_revolute_joints

sources:
  local_product_sheet: official_RS06_manual_260428
  manual_version: '260428'
  manual_git_tag: V26.05.19
  manual_git_blob: 0fe792deba72296a79f1a3a7ed3ce80b0aa94cfa
  manual_sha256: 28972fe4ddb6e2731856536e16cd95d0d5b1f4556c9cd3389fa0bef5e6c53497
  manual_url: https://github.com/RobStride/Product_Information/blob/V26.05.19/产品资料/RS06/RS06使用说明书260428.pdf
  manual_printed_pages: {specifications: [6, 7, 8, 9], overload: [7, 8], parameter_indices: [37]}
  official_product_repository: https://github.com/RobStride/Product_Information
  official_protocol_summary: https://github.com/RobStride/EDULITE_A3/blob/main/el_a3_sdk/docs/电机通信协议汇总.md
  official_python_sdk: https://github.com/RobStride/Python_Sample

mechanical:
  mass_kg: 0.621
  pole_count: 28
  phase_count: 3
  drive_method: FOC
  reduction_ratio: 9.0
  gear_material: machined_steel
  output_equivalent_inertia_kg_m2: 0.012
  output_equivalent_inertia_provenance: engineering_prior_pending_identification
  # Retained simulation estimate, NOT a manufacturer-specified inertia.
  # Apply once as output-side armature, not as link spatial inertia.
  output_joint_friction_nm: 0.01
  # Output-side Coulomb friction used by both Isaac and MuJoCo. This is an
  # engineering identification seed (not a published RS06 datasheet value)
  # and must be replaced after D2W hardware identification.

electrical:
  rated_voltage_v: 48.0
  voltage_range_v: [15.0, 60.0]
  magnetic_encoder_count: 2
  no_load_current_arms: 0.98
  no_load_current_tolerance_percent: 10
  rated_load_phase_current_apk: 14.3
  rated_load_phase_current_tolerance_percent: 10
  peak_phase_current_apk: 57.0
  peak_phase_current_tolerance_percent: 10
  back_emf_vrms_per_krpm: 7.6
  back_emf_tolerance_percent: 10
  line_resistance_ohm: 0.23
  line_resistance_tolerance_percent: 10
  torque_constant_nm_per_arms: 1.09
  inductance_mh: 0.165
  inductance_tolerance_percent: 10
  insulation_class: B

environment:
  operating_temperature_c: [-20, 50]
  operating_humidity_percent: [5, 85]
  storage_temperature_c: [-30, 70]
  running_direction: [CW, CCW]

output_limits:
  no_load_speed_rpm: 480.0
  no_load_speed_rad_s: 50.265482
  no_load_speed_tolerance_percent: 10
  protocol_speed_limit_rad_s: 50.0
  rated_torque_nm: 11.0
  rated_torque_speed_rpm: 100.0
  peak_torque_nm: 36.0
  # The manual itself gives different dimensions for these two conditions.
  standard_use_heatsink_mm: [130, 160]
  test_heatsink_mm: [130, 155]
  overload_test_ambient_temperature_c: 25.0
  overload_test_winding_constraint_temperature_c: 145.0

# Approximate digitization of the 48 V graph on printed page 7, not a
# manufacturer-supplied numerical node table. End extensions are assumptions.
torque_speed_curve_48v:
  # [output_torque_nm, output_speed_rpm]
  - [5.0, 430.0]
  - [11.0, 426.0]
  - [20.0, 390.0]
  - [30.0, 320.0]
  - [36.0, 280.0]

# Piecewise-linear output-side peak envelope. At each joint speed, commanded
# torque must be clamped to the interpolated value.
peak_torque_speed_envelope_rad_s:
  # [absolute_output_speed_rad_s, available_peak_torque_nm]
  - [0.0, 36.0]
  - [29.321531, 36.0]
  - [33.510322, 30.0]
  - [40.840704, 20.0]
  - [44.610616, 11.0]
  - [45.029495, 5.0]
  - [50.265482, 0.0]

# Retained engineering speed derating, NOT a measured thermal-equilibrium
# curve in manual 260428. Only the 11 N.m at 100 rpm anchor is manual-backed.
# The legacy key is retained for simulator/deployment compatibility.
thermal_equilibrium_rotating:
  # [output_speed_rpm, continuous_torque_nm]
  - [100.0, 11.0]
  - [160.0, 11.0]
  - [220.0, 10.5]
  - [280.0, 9.87]
  - [340.0, 9.4]
  - [400.0, 9.3]

rotating_overload_duration:
  # null means continuous under the manual's test condition.
  # [output_torque_nm, maximum_duration_s]
  - [11.0, null]
  - [13.0, 1360.0]
  - [15.0, 280.0]
  - [18.0, 70.0]
  - [23.0, 21.0]
  - [28.0, 11.0]
  - [32.0, 8.0]
  - [34.0, 6.0]
  - [36.0, 5.0]

stall_overload_duration:
  # At or near zero speed, 8 N.m is the conservative continuous limit.
  # [output_torque_nm, maximum_duration_s]
  - [8.0, null]
  - [11.0, 200.0]
  - [17.0, 15.0]
  - [20.0, 11.0]
  - [25.0, 5.0]
  - [30.0, 1.0]
  - [36.0, 1.0]

firmware_private_protocol:
  torque_mapping_nm: [-36.0, 36.0]
  velocity_mapping_rad_s: [-50.0, 50.0]
  position_mapping_rad: [-12.57, 12.57]
  kp_range: [0.0, 5000.0]
  kd_range: [0.0, 100.0]
  limit_torque_range_nm: [0.0, 36.0]
  limit_spd_range_rad_s: [0.0, 50.0]
  spd_ref_range_rad_s: [-50.0, 50.0]
  limit_cur_range_a: [0.0, 57.0]
  iq_ref_range_a: [-57.0, 57.0]
  pp_factory_default:
    vel_max_rad_s: 10.0
    acc_set_rad_s2: 10.0
  velocity_mode_factory_default:
    acc_rad_s2: 20.0

engineering_assumptions:
  continuous_curve_provenance: engineering_prior_with_manual_11Nm_100rpm_anchor
  overload_mode_switch_speed_rpm: 100.0
  overload_mode_switch_provenance: engineering_prior_not_manufacturer_stall_definition
  overload_model_provenance: engineering_budget_not_firmware_temperature_estimator
  overload_interpolation: piecewise_linear_inverse_duration
  overload_recovery_within_episode: false
  overload_reset: clear_budget_on_episode_reset
  phase_current_to_firmware_iq_mapping: unresolved_no_conversion
  electrical_values_not_verified_in_260428: [line_resistance_ohm, inductance_mh, insulation_class]
  pd_gains_provenance: controller_tuning_not_manufacturer_defaults
  friction_provenance: engineering_prior_pending_identification
  delay_provenance: engineering_prior_pending_identification

joint_groups:
  hip_abduction:
    - FL_hip_joint
    - FR_hip_joint
    - RL_hip_joint
    - RR_hip_joint
  hip_flexion:
    - FL_thigh_joint
    - FR_thigh_joint
    - RL_thigh_joint
    - RR_thigh_joint
  knee_flexion:
    - FL_calf_joint
    - FR_calf_joint
    - RL_calf_joint
    - RR_calf_joint

# Controller/reference caps, not URDF hardware limits.
controller_joint_speed_profiles_rad_s:
  commissioning:
    hip_abduction: 6.0
    hip_flexion: 10.0
    knee_flexion: 10.0
  run_2mps:
    hip_abduction: 8.0
    hip_flexion: 20.0
    knee_flexion: 16.0
  run_3mps_research:
    hip_abduction: 12.0
    hip_flexion: 30.0
    knee_flexion: 25.0

recommended_limit_layers:
  urdf_physical_peak:
    effort_nm: 36.0
    velocity_rad_s: 50.265482
    rationale: same_RS06_and_same_integrated_9_to_1_reduction_on_all_12_joints
  explicit_actuator_model:
    actuator_velocity_limit_rad_s: 50.0
    solver_guard_velocity_limit_rad_s: 50.0
    torque_curve: peak_torque_speed_envelope_rad_s
    armature_inertia_kg_m2: 0.012
    note: provisional_output_side_inertia_applied_once_do_not_multiply_by_81
  torque_policy:
    continuous_stall_torque_nm: 8.0
    nominal_moving_torque_nm: 11.0
    short_burst_torque_nm: 25.0
    absolute_peak_torque_nm: 36.0
  requires_time_based_derating: true
  requires_temperature_monitoring: true
  requires_current_limiting: true
