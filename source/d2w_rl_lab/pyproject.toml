[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d2w_rl_lab"
version = "0.1.7"
description = "D2W wheel-legged locomotion training environments for Isaac Lab."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later AND MIT AND Apache-2.0 AND BSD-3-Clause" }
authors = [
    { name = "Tianyang Wu" },
]
maintainers = [
    { name = "Tianyang Wu" },
]
dependencies = [
    # Installed in editable mode from ../rsl_rl by d2w_rl_lab.sh.
    "rsl-rl-lib==3.3.0",
]

classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
video = [
    "imageio-ffmpeg>=0.6.0",
]
mujoco = [
    "mujoco>=3.3.0",
    "PyYAML>=6.0",
    "pygame>=2.6.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["d2w_rl_lab*"]

[tool.setuptools]
license-files = ["COPYING", "LICENSE*", "LICENSES/*.txt", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]
